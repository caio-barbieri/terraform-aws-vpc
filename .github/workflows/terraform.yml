name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate

      - name: Run module tests
        run: terraform test -test-directory=testing

      - name: Initialize basic example
        run: terraform -chdir=examples/basic init -backend=false -input=false

      - name: Validate basic example
        run: terraform -chdir=examples/basic validate

      - name: Initialize complete example
        run: terraform -chdir=examples/complete init -backend=false -input=false

      - name: Validate complete example
        run: terraform -chdir=examples/complete validate
