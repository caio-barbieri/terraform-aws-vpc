name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Initialize TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --format compact

      - name: Install agent schema validator
        run: python -m pip install --disable-pip-version-check --no-input check-jsonschema==0.38.0

      - name: Validate repository agent configuration
        run: |
          agent_schema_url=$(jq -r '."$schema"' .kiro/agents/local-agent.json)
          check-jsonschema --schemafile "$agent_schema_url" .kiro/agents/local-agent.json

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.74.0

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize module
        run: terraform init -backend=false -input=false

      - name: Validate module
        run: terraform validate

      - name: Run module tests
        run: terraform test -test-directory=testing

      - name: Initialize basic example
        run: terraform -chdir=examples/basic init -backend=false -input=false

      - name: Validate basic example
        run: terraform -chdir=examples/basic validate

      - name: Initialize complete example
        run: terraform -chdir=examples/complete init -backend=false -input=false

      - name: Validate complete example
        run: terraform -chdir=examples/complete validate
