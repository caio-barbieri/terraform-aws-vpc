name: Conventional PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    name: Validate title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]].+$'

          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "PR title must follow Conventional Commits." >&2
            echo "Examples: feat(vpc): add IPv6 support, fix!: remove a legacy default" >&2
            exit 1
          fi

          if (( ${#PR_TITLE} > 72 )); then
            echo "::warning::Keep the PR title at 72 characters or fewer when practical."
          fi
